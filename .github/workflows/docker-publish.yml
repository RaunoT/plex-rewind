name: Publish Docker image

# Builds and smoke tests each platform on a native runner, pushes the images by
# digest, then tags them together as one multi-platform image. Called by the
# CI, pre-release and release workflows.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version shown in the app (NEXT_PUBLIC_VERSION_TAG)'
        type: string
        required: true
      tags:
        description: 'Tags to publish, one per line'
        type: string
        required: true
      platforms:
        description: 'JSON array of platforms to build'
        type: string
        default: '["linux/amd64", "linux/arm64"]'
      dockerhub:
        description: 'Publish to Docker Hub as well as GHCR'
        type: boolean
        default: false
      require-head:
        description: 'Skip tagging if the branch has moved past this commit'
        type: boolean
        default: false
    outputs:
      published:
        description: "'true' when the tags were pushed"
        value: ${{ jobs.merge.outputs.published }}
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/raunot/plex-rewind
  DOCKERHUB_IMAGE: raunoot/plex-rewind

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          tags: plex-rewind:smoke
          build-args: |
            NEXT_PUBLIC_VERSION_TAG=${{ inputs.version }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          provenance: false
          sbom: false

      - name: Smoke test image
        run: bash .github/scripts/smoke-test.sh plex-rewind:smoke

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reuses the layers from the smoke test build, so this only pushes.
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.GHCR_IMAGE }}
            ${{ inputs.dockerhub && env.DOCKERHUB_IMAGE || '' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NEXT_PUBLIC_VERSION_TAG=${{ inputs.version }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Tag multi-platform image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      # Release runs queue rather than cancel, so if the branch moved on while
      # this run was building, the queued run for the newer commit publishes
      # instead and this one must not tag anything.
      - name: Check the branch still points at this commit
        id: head
        if: inputs.require-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"

          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME is at $latest, not $GITHUB_SHA. The newer run publishes the release."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Every platform was pushed to each registry, so the GHCR digests can be
      # tagged in both.
      - name: Create and push manifest list
        id: publish
        if: steps.head.outputs.moved != 'true'
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
          DOCKERHUB: ${{ inputs.dockerhub }}
        run: |
          images=("$GHCR_IMAGE")

          if [ "$DOCKERHUB" = 'true' ]; then
            images+=("$DOCKERHUB_IMAGE")
          fi

          args=()

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            for image in "${images[@]}"; do
              args+=(--tag "$image:$tag")
            done
          done <<< "$TAGS"

          for digest in *; do
            args+=("$GHCR_IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${args[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        if: steps.publish.outcome == 'success'
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          tag="$(grep -m1 . <<< "$TAGS")"
          docker buildx imagetools inspect "$GHCR_IMAGE:$tag"
