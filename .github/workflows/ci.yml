name: CI

on:
  workflow_dispatch:
    inputs:
      build_amd64:
        description: 'Build linux/amd64'
        type: boolean
        default: true
        required: false
      build_arm64:
        description: 'Build linux/arm64'
        type: boolean
        default: false
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and publish test image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ github.sha }}
      tags: ${{ github.sha }}
      # amd64 when neither platform is picked
      platforms: ${{ inputs.build_arm64 && (inputs.build_amd64 && '["linux/amd64", "linux/arm64"]' || '["linux/arm64"]') || '["linux/amd64"]' }}
