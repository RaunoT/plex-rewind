name: CI

on:
  workflow_dispatch:
    inputs:
      build_amd64:
        description: 'Build linux/amd64'
        type: boolean
        default: true
        required: false
      build_arm64:
        description: 'Build linux/arm64'
        type: boolean
        default: false
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and publish test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute platforms
        id: platforms
        run: |
          platforms=()
          if [ "${{ inputs.build_amd64 }}" = "true" ]; then platforms+=("linux/amd64"); fi
          if [ "${{ inputs.build_arm64 }}" = "true" ]; then platforms+=("linux/arm64"); fi
          if [ ${#platforms[@]} -eq 0 ]; then platforms=("linux/amd64"); fi
          platforms_str=$(IFS=,; echo "${platforms[*]}")
          echo "platforms=$platforms_str" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ contains(steps.platforms.outputs.platforms, 'linux/arm64') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ steps.platforms.outputs.platforms }}
          tags: |
            ghcr.io/raunot/plex-rewind:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
