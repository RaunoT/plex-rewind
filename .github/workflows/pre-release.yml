name: Pre-release

on:
  push:
    branches:
      - develop

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint code and check formatting
        run: pnpm lint:all

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run --if-present test

  version:
    name: Determine version
    needs: verify
    runs-on: ubuntu-latest
    # The dry run checks that it can push, so it needs write access.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run Semantic Release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

      # The dry run puts the next version in NEXT_VERSION_TAG, which stays
      # empty when nothing needs releasing.
      - name: Output version
        id: version
        run: echo "tag=${NEXT_VERSION_TAG:-}" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image
    needs: version
    if: needs.version.outputs.tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.tag }}
      tags: |
        develop
        ${{ needs.version.outputs.tag }}
      dockerhub: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The main branch ruleset requires this check by name. It runs even when an
  # earlier job fails, so a failed image build can't pass as a skipped check.
  pre-release:
    name: Publish image and pre-release
    needs: [version, image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check the image was published
        id: check
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          VERSION: ${{ needs.version.outputs.tag }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISHED: ${{ needs.image.outputs.published }}
        run: |
          if [ "$VERSION_RESULT" != 'success' ]; then
            echo "Determine version ended with: $VERSION_RESULT"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo 'Nothing to release.'
            exit 0
          fi

          # published is set before the image job's last step, so the job's
          # result is checked too.
          if [ "$IMAGE_RESULT" != 'success' ] || [ "$PUBLISHED" != 'true' ]; then
            echo "The $VERSION image was not published (image job: $IMAGE_RESULT)."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        if: steps.check.outputs.publish
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.check.outputs.publish
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check.outputs.publish
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run Semantic Release publish
        if: steps.check.outputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  # GITHUB_TOKEN can open the PR: it starts no pull_request workflows, but the
  # main ruleset's required checks come from this run on the same commit.
  release-pr:
    name: Open release PR
    needs: [version, pre-release]
    if: needs.version.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          changes=$(gh api "repos/$GH_REPO/compare/main...develop" \
            --jq '.commits[] | select(.parents | length == 1) | "- " + (.commit.message | split("\n")[0])')

          if [ -z "$changes" ]; then
            echo 'develop has no changes that main does not.'
            exit 0
          fi

          # A 5.5.0-develop.3 pre-release ships from main as 5.5.0.
          title="chore: release ${VERSION%%-*}"
          body=$(printf 'Opened by the Pre-release workflow, which rewrites this description after each pre-release.\n\n%s\n' "$changes")
          number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$number" ]; then
            gh api --method PATCH "repos/$GH_REPO/pulls/$number" -f title="$title" -f body="$body" --silent
          else
            gh pr create --base main --head develop --title "$title" --body "$body"
          fi
