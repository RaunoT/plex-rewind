name: Release

on:
  push:
    branches:
      - main

# Queue instead of cancelling: the image is pushed before semantic-release
# tags the release and backmerges, so cancelling mid-run can leave a published
# image without a matching release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint code and check formatting
        run: pnpm lint:all

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run --if-present test

  version:
    name: Determine version
    needs: verify
    runs-on: ubuntu-latest
    # The dry run checks that it can push, so it needs write access.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run Semantic Release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

      # The dry run puts the next version in NEXT_VERSION_TAG, which stays
      # empty when nothing needs releasing.
      - name: Output version
        id: version
        run: echo "tag=${NEXT_VERSION_TAG:-}" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image
    needs: version
    if: needs.version.outputs.tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.tag }}
      tags: |
        latest
        ${{ needs.version.outputs.tag }}
      dockerhub: true
      require-head: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Publish release
    needs: image
    if: needs.image.outputs.published == 'true'
    runs-on: ubuntu-latest
    # The publish step authenticates with the GH_TOKEN secret, so the workflow
    # token only needs to check out the code.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run Semantic Release publish
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm exec semantic-release
