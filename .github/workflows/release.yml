name: Release

on:
  push:
    branches:
      - main

# Queue instead of cancelling: the image is pushed before semantic-release
# tags the release and backmerges, so cancelling mid-run can leave a published
# image without a matching release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint & test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint code and check formatting
        run: pnpm lint:all

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run --if-present test

  release:
    name: Publish image and release
    needs: verify
    runs-on: ubuntu-latest
    # The publish step authenticates with the GH_TOKEN secret, so the workflow
    # token only needs to push (dry run) and to log in to GHCR.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Run Semantic Release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run

      - name: Set up QEMU
        if: env.NEXT_VERSION_TAG
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: env.NEXT_VERSION_TAG
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for smoke test
        if: env.NEXT_VERSION_TAG
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: plex-rewind:smoke
          build-args: |
            NEXT_PUBLIC_VERSION_TAG=${{ env.NEXT_VERSION_TAG }}
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Smoke test image
        if: env.NEXT_VERSION_TAG
        run: bash .github/scripts/smoke-test.sh plex-rewind:smoke

      # If main moved on while this run was building, the queued run for the
      # newer commit publishes the release, so don't push images for this one.
      - name: Skip publishing if main has moved on
        if: env.NEXT_VERSION_TAG
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"

          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "main is at $latest, not $GITHUB_SHA. The newer run publishes the release."
            echo "NEXT_VERSION_TAG=" >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        if: env.NEXT_VERSION_TAG
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.NEXT_VERSION_TAG
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: env.NEXT_VERSION_TAG
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/raunot/plex-rewind:latest
            ghcr.io/raunot/plex-rewind:${{ env.NEXT_VERSION_TAG }}
            raunoot/plex-rewind:latest
            raunoot/plex-rewind:${{ env.NEXT_VERSION_TAG }}
          build-args: |
            NEXT_PUBLIC_VERSION_TAG=${{ env.NEXT_VERSION_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Run Semantic Release publish
        if: env.NEXT_VERSION_TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm exec semantic-release
